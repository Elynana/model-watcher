name: model-watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        default: watch
        options:
          - watch
          - seed
          - shadow
      force:
        description: Ignore per-source intervals for this run
        type: boolean
        default: false

concurrency:
  group: model-watcher-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out watcher code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare durable state worktree
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/model-watcher-state >/dev/null 2>&1; then
            git fetch origin refs/heads/model-watcher-state:refs/heads/model-watcher-state
          else
            git branch model-watcher-state
          fi
          git worktree add .state model-watcher-state
          mkdir -p .state/data/state

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Poll sources and publish changes
        shell: bash
        env:
          STATE_DIR: .state/data/state
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IMAGE_CARDS: ${{ vars.IMAGE_CARDS || '1' }}
          SHADOW_MODE: ${{ (github.event.inputs.mode == 'shadow' && '1') || vars.SHADOW_MODE || '0' }}
          CONCURRENCY: ${{ vars.CONCURRENCY || '6' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          AI21_API_KEY: ${{ secrets.AI21_API_KEY }}
          WRITER_API_KEY: ${{ secrets.WRITER_API_KEY }}
          REKA_API_KEY: ${{ secrets.REKA_API_KEY }}
          LIQUID_API_KEY: ${{ secrets.LIQUID_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          YI_API_KEY: ${{ secrets.YI_API_KEY }}
          BAICHUAN_API_KEY: ${{ secrets.BAICHUAN_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          AIMLAPI_API_KEY: ${{ secrets.AIMLAPI_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
          PIXVERSE_API_KEY: ${{ secrets.PIXVERSE_API_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          HUME_API_KEY: ${{ secrets.HUME_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          args=()
          if [ "${{ github.event.inputs.mode }}" = "seed" ]; then args+=(--seed); fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then args+=(--force); fi
          pnpm watch -- "${args[@]}"

      - name: Commit durable state
        shell: bash
        run: |
          git -C .state config user.name "model-watcher[bot]"
          git -C .state config user.email "model-watcher@users.noreply.github.com"
          git -C .state add -f data/state
          if git -C .state diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git -C .state commit -m "state: update model watcher"
          git -C .state push --set-upstream origin model-watcher-state
